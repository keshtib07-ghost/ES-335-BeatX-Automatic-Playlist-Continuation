name: Model and website checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install model and serving dependencies
        run: python -m pip install -r requirements-serve.txt
      - name: Model and API tests
        run: python -m unittest discover -s tests -v
      - name: Website tests
        run: node --test tests/*.cjs
      - name: Check Python source syntax
        run: python -m compileall -q src scripts deploy
